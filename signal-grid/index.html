    <!--
      Inline, so the page paints in the right scheme before any stylesheet or module has loaded.
      The document keeps `color-scheme: light dark` unless a stored choice pins it, which is what
      every `light-dark()` value in site.css and theme.css resolves against.
    -->
    <style>
      :root {
        color-scheme: light dark;
        background: light-dark(#fbfcfd, #101317);
      }
    </style>
    <script>
      try {
        var stored = localStorage.getItem("signal-grid-site-theme")
        if (stored === "light" || stored === "dark") document.documentElement.style.colorScheme = stored
      } catch (error) {
        /* private mode: the auto scheme above is already correct */
      }
    </script>
