[package]
name = "grapht_layout_wasm"
version = "0.1.0"
edition = "2021"
description = "Deterministic grid layout compiled to wasm32-unknown-unknown for a Web Worker"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "grapht_layout_wasm"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
