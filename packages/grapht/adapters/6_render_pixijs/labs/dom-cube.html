<!doctype html>
<html>
<head>
<!-- Lab: 8 DOMContainer popovers track the projected vertices of a rotating cube.
     ?heavy=1 restores the config that saturated the main thread (full-window 2x MSAA canvas, uncapped ticker).
     Measured by e2e/3_dom_cube.spec.ts. -->
<meta charset="utf-8" />
<title>grapht pixijs lab: DOMContainer cube</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 12px/1.3 ui-monospace, monospace; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; width: 800px; height: 600px; }
  .pop { will-change: transform; background: rgba(20,20,30,.85); border: 1px solid #6af; border-radius: 4px; padding: 4px 6px; white-space: pre; pointer-events: none; }
  .pop b { color: #6af; }
  #hud { position: fixed; left: 8px; top: 8px; white-space: pre; color: #9c9; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script type="module">
import { Application, Graphics, Container, DOMContainer } from "pixi.js"

const app = new Application()
const HEAVY = new URLSearchParams(location.search).has("heavy")
await app.init(HEAVY
  ? { resizeTo: window, background: 0x111111, antialias: true, resolution: devicePixelRatio, autoDensity: true }
  : { width: 800, height: 600, background: 0x111111, antialias: false, resolution: 1, autoDensity: true, powerPreference: "low-power" })
if (!HEAVY) app.ticker.maxFPS = 30
if (HEAVY) document.getElementById("stage").style.cssText = "position:fixed;inset:0"
document.getElementById("stage").appendChild(app.canvas)

// cube in model space, side 2, centered
const V = []
for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) V.push([x, y, z])
const E = []
for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
  let d = 0; for (let k = 0; k < 3; k++) d += V[i][k] !== V[j][k]
  if (d === 1) E.push([i, j])
}

const world = new Container()
app.stage.addChild(world)
const wire = new Graphics()
world.addChild(wire)
world.sortableChildren = true

// one DOMContainer per vertex; element is plain HTML
const pops = V.map((v, i) => {
  const el = document.createElement("div")
  el.className = "pop"
  const dc = new DOMContainer({ element: el, anchor: 0 })
  dc.label = "v" + i
  world.addChild(dc)
  return { el, dc }
})

const SCALE = 160, CAM = 5       // perspective: camera at z=CAM looking at origin
let ax = 0, ay = 0, az = 0
const hud = document.getElementById("hud")

function rot([x, y, z]) {
  let c = Math.cos(ax), s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c]
  c = Math.cos(ay); s = Math.sin(ay);     [x, z] = [x * c + z * s, -x * s + z * c]
  c = Math.cos(az); s = Math.sin(az);     [x, y] = [x * c - y * s, x * s + y * c]
  return [x, y, z]
}
function project([x, y, z]) {
  const p = CAM / (CAM - z)              // z toward camera => bigger
  return { sx: x * p * SCALE, sy: -y * p * SCALE, p }
}

let frames = 0
app.ticker.add((t) => {
  frames++
  const dt = t.deltaMS / 1000
  ax += 0.7 * dt; ay += 1.1 * dt; az += 0.3 * dt
  world.position.set(app.screen.width / 2, app.screen.height / 2)

  const P = V.map(v => project(rot(v)))
  wire.clear()
  for (const [i, j] of E) wire.moveTo(P[i].sx, P[i].sy).lineTo(P[j].sx, P[j].sy)
  wire.stroke({ color: 0x66aaff, width: 2 })
  for (const q of P) wire.circle(q.sx, q.sy, 4).fill(0xffcc33)

  P.forEach((q, i) => {
    const { el, dc } = pops[i]
    const r = rot(V[i])
    dc.position.set(q.sx + 8, q.sy + 8)
    // depth cue: element scales with perspective so "farther" reads as smaller
    dc.scale.set(q.p)
    dc.zIndex = q.p
    if (HEAVY || (t.lastTime | 0) % 100 < 17) el.innerHTML = `<b>v${i}</b> model ${V[i].join(",")}\nworld ${r.map(n => n.toFixed(2)).join(",")}\nscreen ${q.sx.toFixed(0)},${q.sy.toFixed(0)} p=${q.p.toFixed(2)}`
  })

  const far = P.reduce((a, q, i) => q.p < P[a].p ? i : a, 0)
  const near = P.reduce((a, q, i) => q.p > P[a].p ? i : a, 0)
  if (HEAVY || (t.lastTime | 0) % 500 < 40) hud.textContent = `pixi ${app.renderer.name} ${app.renderer.type === 1 ? "webgl" : "webgpu"}  fps ${app.ticker.FPS.toFixed(0)}\nnearest v${near} p=${P[near].p.toFixed(2)}   farthest v${far} p=${P[far].p.toFixed(2)}\nDOM popovers: ${document.querySelectorAll(".pop").length}`
})
window.__cube = { app, pops, V, frames: () => frames }
</script>
</body>
</html>
