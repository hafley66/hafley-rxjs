<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>grapht pixijs lab: spinning cube as a scene</title>
<!-- Lab: one constant Scene, a Layout that projects the cube at the current angle, frames at t=1.
     ?n=<points> scales load; ?renderer=pixi|dom|native picks the sink; 8 corner cards are HTML in every mode. -->
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 12px ui-monospace, monospace; }
  #host { position: fixed; left: 0; top: 0; width: 800px; height: 600px; }
  .scene-card { will-change: transform; background: rgba(20,20,30,.85); border: 1px solid #6af; border-radius: 4px; padding: 3px 6px; white-space: pre; pointer-events: none; }
  .scene-card b { color: #6af; }
  .scene-item[data-kind="node"] { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #4a7fdf; }
  .scene-item[data-kind="card"] { background: rgba(20,20,30,.85); border: 1px solid #6af; border-radius: 4px; padding: 3px 6px; white-space: pre; pointer-events: none; }
  .scene-item[data-kind="card"] b { color: #6af; }
  #hud { position: fixed; left: 8px; top: 8px; color: #9c9; white-space: pre; }
</style>
</head>
<body>
<div id="host"></div>
<div id="hud"></div>
<script type="module">
import { animationFrames, map, of, timer } from "rxjs"
import { dom, frames, keyframes, tween } from "@hafley66/scene"
import { Application, Container, DOMContainer, Graphics, Sprite } from "pixi.js"
import { inspect, pixi } from "@hafley66/scene/pixi"

const params = new URLSearchParams(location.search)
const N = Number(params.get("n") ?? 2000)
const RENDERER = params.get("renderer") ?? "pixi"
const SCALE = 160, CAM = 5

// points: 8 corners first, then N-8 samples along the 12 edges
const corners = []
for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) corners.push([x, y, z])
const edgePairs = []
for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
  let d = 0; for (let k = 0; k < 3; k++) d += corners[i][k] !== corners[j][k]
  if (d === 1) edgePairs.push([i, j])
}
const model = new Float32Array(N * 3)
for (let i = 0; i < N; i++) {
  let p
  if (i < 8) p = corners[i]
  else {
    const [a, b] = edgePairs[i % 12]
    const t = ((i / 12) | 0) / Math.max(1, ((N - 8) / 12) | 0)
    p = [0, 1, 2].map(k => corners[a][k] + (corners[b][k] - corners[a][k]) * t)
  }
  model.set(p, i * 3)
}

const ids = Array.from({ length: N }, (_, i) => `p${i}`)
const items = new Map(ids.map(id => [id, { id, kind: "node" }]))
const cards = corners.map((c, i) => ({ id: `card:${i}`, kind: "card", parent: `p${i}`, attrs: { html: `<b>v${i}</b> ${c.join(",")}` } }))
for (const c of cards) items.set(c.id, c)
const edges = new Map(edgePairs.map(([a, b], i) => [`e${i}`, [`p${a}`, `p${b}`]]))
const allIds = [...items.keys()]
const scene = { items, edges }

// the layout IS the rotation: angle comes from the scene emission's attrs-free closure below
let angle = { x: 0, y: 0, z: 0 }
const pos = new Float32Array(allIds.length * 2)
const layout = () => {
  const cx = Math.cos(angle.x), sx = Math.sin(angle.x)
  const cy = Math.cos(angle.y), sy = Math.sin(angle.y)
  const cz = Math.cos(angle.z), sz = Math.sin(angle.z)
  for (let i = 0; i < N; i++) {
    let x = model[3 * i], y = model[3 * i + 1], z = model[3 * i + 2]
    let y1 = y * cx - z * sx, z1 = y * sx + z * cx
    let x2 = x * cy + z1 * sy, z2 = -x * sy + z1 * cy
    let x3 = x2 * cz - y1 * sz, y3 = x2 * sz + y1 * cz
    const p = CAM / (CAM - z2)
    pos[2 * i] = 400 + x3 * p * SCALE
    pos[2 * i + 1] = 300 - y3 * p * SCALE
  }
  for (let c = 0; c < 8; c++) {
    pos[2 * (N + c)] = pos[2 * c] + 8
    pos[2 * (N + c) + 1] = pos[2 * c + 1] + 8
  }
  return { ids: allIds, pos }
}

let frameCount = 0
const spin = elapsed => {
  const s = elapsed / 1000
  angle = { x: 0.7 * s, y: 1.1 * s, z: 0.3 * s }
  frameCount++
}
const tick$ = animationFrames().pipe(map(({ elapsed }) => (spin(elapsed), scene)))

const host = document.getElementById("host")
let sub
let ready = RENDERER !== "pixi"
if (RENDERER === "pixi") {
  sub = tick$.pipe(keyframes(layout), frames(tween(), of(1)), pixi({ maxFPS: 120 })(host)).subscribe()
} else if (RENDERER === "dom") {
  sub = tick$.pipe(keyframes(layout), frames(tween(), of(1)), dom()(host)).subscribe()
} else {
  // native baseline: same layout math, sprites and DOMContainers written directly, no scene pipeline
  ready = false
  const app = new Application()
  await app.init({ width: 800, height: 600, background: 0x111111, resolution: 1, autoDensity: true, antialias: false })
  app.ticker.maxFPS = 120
  host.appendChild(app.canvas)
  const world = new Container()
  app.stage.addChild(world)
  const edgesG = new Graphics()
  world.addChild(edgesG)
  const g = new Graphics().circle(0, 0, 4).fill({ color: 0x4a7fdf })
  const texture = app.renderer.generateTexture({ target: g, resolution: 1 })
  const sprites = Array.from({ length: N }, () => world.addChild(new Sprite({ texture, anchor: 0.5 })))
  const domCards = cards.map(c => {
    const el = document.createElement("div")
    el.className = "scene-card"
    el.innerHTML = c.attrs.html
    return world.addChild(new DOMContainer({ element: el }))
  })
  ready = true
  sub = animationFrames().subscribe(({ elapsed }) => {
    spin(elapsed)
    layout()
    for (let i = 0; i < N; i++) sprites[i].position.set(pos[2 * i], pos[2 * i + 1])
    for (let c = 0; c < 8; c++) domCards[c].position.set(pos[2 * (N + c)], pos[2 * (N + c) + 1])
    edgesG.clear()
    for (const [a, b] of edgePairs) edgesG.moveTo(pos[2 * a], pos[2 * a + 1]).lineTo(pos[2 * b], pos[2 * b + 1])
    edgesG.stroke({ color: 0x2a3a55, width: 1.5 })
  })
}

const hud = document.getElementById("hud")
let lastCount = 0, lastT = performance.now(), fps = 0
timer(0, 500).subscribe(() => {
  const now = performance.now()
  fps = ((frameCount - lastCount) * 1000) / (now - lastT)
  lastCount = frameCount; lastT = now
  hud.textContent = `${RENDERER} n=${N}  views ${viewCount()}  fps ${fps.toFixed(1)}`
})
function viewCount() {
  if (RENDERER === "pixi") return inspect(host)?.ids.length ?? 0
  if (RENDERER === "dom") return host.querySelectorAll(".scene-item").length
  return N + 8
}
window.__lab = {
  host, n: N, renderer: RENDERER, frames: () => frameCount, sub,
  inspect: () => ({ ids: { length: viewCount() }, ready: RENDERER === "pixi" ? (inspect(host)?.ready ?? false) : ready }),
}
</script>
</body>
</html>
