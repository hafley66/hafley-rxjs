<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky sequence board</title>
    <link rel="stylesheet" href="../12_sequenceDemo.css" />
  </head>
  <body>
    <main>
      <aside>
        <h1>Sequence board</h1>
        <label>Language
          <select data-language>
            <option value="mermaid">Mermaid</option>
            <option value="d2">D2</option>
          </select>
        </label>
        <label>Focus occurrence<select data-occurrence></select></label>
        <label>Camera X<input data-camera-x type="range" min="-700" max="300" value="0" /></label>
        <label>Camera Y<input data-camera-y type="range" min="-700" max="300" value="0" /></label>
        <label>Scale<input data-camera-scale type="range" min="0.35" max="2" value="1" step="0.05" /></label>
        <button data-reload type="button">Rebuild fixture</button>
        <output data-status data-state="loading">loading</output>
      </aside>
      <section class="stage">
        <div data-board></div>
        <div class="inspectors">
          <pre data-receipt aria-label="Board receipt"></pre>
          <pre data-source aria-label="Source document"></pre>
        </div>
      </section>
    </main>
    <script type="module" src="../src/12_sequenceDemo.ts"></script>
  </body>
</html>
