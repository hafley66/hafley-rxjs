<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>grapht pixijs lab: scene renderer</title>
<!-- Lab: @hafley66/scene pipeline over the pixi() renderer. Steps cycle three scenes; kept ids tween, cards are DOMContainer. -->
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 12px ui-monospace, monospace; }
  #host { position: fixed; left: 0; top: 0; width: 800px; height: 600px; }
  .scene-card { will-change: transform; background: rgba(20,20,30,.85); border: 1px solid #6af; border-radius: 4px; padding: 3px 6px; white-space: pre; }
  #hud { position: fixed; left: 8px; top: 8px; color: #9c9; white-space: pre; }
</style>
</head>
<body>
<div id="host"></div>
<div id="hud"></div>
<script type="module">
import { BehaviorSubject, animationFrames, map, takeWhile, timer } from "rxjs"
import { easeInOutCubic, frames, geometryOf, keyframes, tween } from "@hafley66/scene"
import { inspect, pixi } from "../src/8_sceneRenderer.ts"

const N = 400
const ids = Array.from({ length: N }, (_, i) => `n${i}`)
const scenes = [
  makeScene(ids.slice(0, 300), 20, "grid"),
  makeScene(ids.slice(100, 400), 15, "grid"),
  makeScene(ids.slice(0, 400), 25, "ring"),
]

function makeScene(members, cols, shape) {
  const items = new Map(members.map(id => [id, { id, kind: "node" }]))
  for (const id of members.slice(0, 4)) items.set(`card:${id}`, { id: `card:${id}`, kind: "card", parent: id, attrs: { html: `<b>${id}</b>\n${shape}` } })
  const edges = new Map()
  for (let i = 1; i < members.length; i++) edges.set(`e${i}`, [members[i - 1], members[i]])
  return { items, edges, shape, cols }
}

const layout = scene => {
  const nodeIds = [...scene.items.values()].filter(i => i.kind === "node").map(i => i.id)
  const points = new Map()
  nodeIds.forEach((id, i) => {
    if (scene.shape === "ring") {
      const a = (i / nodeIds.length) * Math.PI * 2
      points.set(id, [400 + Math.cos(a) * 260, 300 + Math.sin(a) * 260])
    } else {
      points.set(id, [40 + (i % scene.cols) * (720 / scene.cols), 40 + Math.floor(i / scene.cols) * 24])
    }
  })
  for (const item of scene.items.values()) {
    if (item.kind === "card") {
      const p = points.get(item.parent)
      points.set(item.id, [p[0] + 8, p[1] + 8])
    }
  }
  return geometryOf([...scene.items.keys()], points)
}

const DURATION = 600
const clock = animationFrames().pipe(map(({ elapsed }) => elapsed / DURATION), takeWhile(t => t < 1, true))

const step = new BehaviorSubject(0)
const host = document.getElementById("host")
const sub = step.pipe(map(i => scenes[i % scenes.length]), keyframes(layout), frames(tween(easeInOutCubic), clock), pixi({ maxFPS: 60 })(host)).subscribe()

const hud = document.getElementById("hud")
timer(0, 250).subscribe(() => {
  const info = inspect(host)
  hud.textContent = `step ${step.value}  views ${info?.ids.length ?? 0}  pooled ${info?.pooled ?? 0}  cards ${document.querySelectorAll(".scene-card").length}`
})
window.__lab = { step, host, inspect: () => inspect(host), sub }
</script>
</body>
</html>
