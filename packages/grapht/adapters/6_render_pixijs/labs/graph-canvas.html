<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixiJS interactive graph canvas</title>
    <link rel="stylesheet" href="/8_graphCanvas.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>PixiJS graph canvas</h1>
          <p>Drag canvas to pan. Wheel to zoom. Drag, hover, and select nodes.</p>
        </div>
        <button id="fit" type="button">Fit graph</button>
      </header>
      <div id="graph" aria-label="Interactive PixiJS graph"></div>
      <output id="state" aria-live="polite"></output>
    </main>
    <script type="module" src="/src/8_graphCanvas.ts"></script>
  </body>
</html>
