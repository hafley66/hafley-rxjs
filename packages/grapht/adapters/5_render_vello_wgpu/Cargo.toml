[package]
name = "grapht-render-vello-wgpu"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vello = "0.9"
wasm-bindgen = "0.2"
wgpu = "29"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
