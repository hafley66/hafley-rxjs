<!doctype html>
<html>
<head>
<!-- Lab: 8 CSS2DObject popovers track the projected vertices of a rotating cube.
     ?heavy=1 restores the config that saturated the main thread (full-window 2x MSAA canvas, uncapped loop).
     Measured by e2e/3_dom_cube.spec.ts. -->
<meta charset="utf-8" />
<title>grapht threejs lab: CSS2D cube</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 12px/1.3 ui-monospace, monospace; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; width: 800px; height: 600px; }
  #stage canvas { position: absolute; left: 0; top: 0; }
  #dom-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
  .pop { will-change: transform; transform-origin: 0 0; background: rgba(20,20,30,.85); border: 1px solid #6af; border-radius: 4px; padding: 4px 6px; white-space: pre; pointer-events: none; }
  .pop b { color: #6af; }
  #hud { position: fixed; left: 8px; top: 8px; white-space: pre; color: #9c9; z-index: 100; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script type="module">
import { BufferAttribute, BufferGeometry, Group, LineBasicMaterial, LineSegments, OrthographicCamera, Points, PointsMaterial, Scene, WebGLRenderer } from "three"
import { CSS2DObject, CSS2DRenderer } from "three/examples/jsm/renderers/CSS2DRenderer.js"

const HEAVY = new URLSearchParams(location.search).has("heavy")
const stage = document.getElementById("stage")
if (HEAVY) stage.style.cssText = "position:fixed;inset:0"

const renderer = new WebGLRenderer(HEAVY
  ? { antialias: true }
  : { antialias: false, powerPreference: "low-power" })
renderer.setPixelRatio(HEAVY ? devicePixelRatio : 1)
renderer.setClearColor(0x111111, 1)
stage.appendChild(renderer.domElement)

// CSS2D writes into its own layer stacked over the WebGL canvas; the layer stays at CSS scale 1
const css2d = new CSS2DRenderer()
css2d.domElement.id = "dom-layer"
stage.appendChild(css2d.domElement)

const scene = new Scene()
const camera = new OrthographicCamera(-400, 400, 300, -300, 0.1, 2000)
camera.position.z = 1000

let W = 800, H = 600
function resize() {
  W = HEAVY ? innerWidth : 800
  H = HEAVY ? innerHeight : 600
  renderer.setSize(W, H)
  css2d.setSize(W, H)
  camera.left = -W / 2; camera.right = W / 2; camera.top = H / 2; camera.bottom = -H / 2
  camera.updateProjectionMatrix()
}
resize()
if (HEAVY) addEventListener("resize", resize)

// cube in model space, side 2, centered
const V = []
for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) V.push([x, y, z])
const E = []
for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
  let d = 0; for (let k = 0; k < 3; k++) d += V[i][k] !== V[j][k]
  if (d === 1) E.push([i, j])
}

const world = new Group()
scene.add(world)
const edgePositions = new Float32Array(E.length * 2 * 3)
const edgeGeometry = new BufferGeometry()
edgeGeometry.setAttribute("position", new BufferAttribute(edgePositions, 3))
const wire = new LineSegments(edgeGeometry, new LineBasicMaterial({ color: 0x66aaff }))
world.add(wire)
const dotPositions = new Float32Array(V.length * 3)
const dotGeometry = new BufferGeometry()
dotGeometry.setAttribute("position", new BufferAttribute(dotPositions, 3))
const dots = new Points(dotGeometry, new PointsMaterial({ color: 0xffcc33, size: 8, sizeAttenuation: false }))
world.add(dots)

// one CSS2DObject per vertex; element is plain HTML
const pops = V.map((v, i) => {
  const el = document.createElement("div")
  el.className = "pop"
  const dc = new CSS2DObject(el)
  dc.center.set(0, 0)             // top-left anchor, matching DOMContainer anchor 0
  dc.name = "v" + i
  dc.onAfterRender = () => { el.style.transform += " scale(" + dc.userData.p + ")" }
  world.add(dc)
  return { el, dc }
})

const SCALE = 160, CAM = 5       // perspective: camera at z=CAM looking at origin
let ax = 0, ay = 0, az = 0
const hud = document.getElementById("hud")

function rot([x, y, z]) {
  let c = Math.cos(ax), s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c]
  c = Math.cos(ay); s = Math.sin(ay);     [x, z] = [x * c + z * s, -x * s + z * c]
  c = Math.cos(az); s = Math.sin(az);     [x, y] = [x * c - y * s, x * s + y * c]
  return [x, y, z]
}
function project([x, y, z]) {
  const p = CAM / (CAM - z)              // z toward camera => bigger
  return { sx: x * p * SCALE, sy: -y * p * SCALE, p }
}

// same cap arithmetic Ticker.maxFPS uses: skip until the integer delta clears minElapsedMS
const minElapsedMS = HEAVY ? 0 : 1000 / 30
let lastFrame = performance.now(), lastTime = lastFrame
let frames = 0, fps = 0

function frame(now) {
  requestAnimationFrame(frame)
  if (now <= lastTime) return
  let elapsedMS = now - lastTime
  if (elapsedMS > 100) elapsedMS = 100         // Ticker minFPS 10 clamp
  if (minElapsedMS) {
    const delta = now - lastFrame | 0
    if (delta < minElapsedMS) return
    lastFrame = now - delta % minElapsedMS
  }
  lastTime = now
  tick(now, elapsedMS)
}

function tick(now, elapsedMS) {
  frames++
  const dt = elapsedMS / 1000
  fps += (1000 / Math.max(elapsedMS, 1) - fps) * 0.1
  ax += 0.7 * dt; ay += 1.1 * dt; az += 0.3 * dt

  const P = V.map(v => project(rot(v)))
  for (let e = 0; e < E.length; e++) {
    const [i, j] = E[e]
    edgePositions[e * 6] = P[i].sx; edgePositions[e * 6 + 1] = -P[i].sy; edgePositions[e * 6 + 2] = 0
    edgePositions[e * 6 + 3] = P[j].sx; edgePositions[e * 6 + 4] = -P[j].sy; edgePositions[e * 6 + 5] = 0
  }
  edgeGeometry.attributes.position.needsUpdate = true
  for (let i = 0; i < P.length; i++) {
    dotPositions[i * 3] = P[i].sx; dotPositions[i * 3 + 1] = -P[i].sy; dotPositions[i * 3 + 2] = 1
  }
  dotGeometry.attributes.position.needsUpdate = true

  P.forEach((q, i) => {
    const { el, dc } = pops[i]
    const r = rot(V[i])
    // depth cue: element scales with perspective so "farther" reads as smaller, and
    // z carries the same ordering CSS2DRenderer sorts z-index by
    dc.position.set(q.sx + 8, -(q.sy + 8), q.p * 100)
    dc.userData.p = q.p
    if (HEAVY || (now | 0) % 100 < 17) el.innerHTML = `<b>v${i}</b> model ${V[i].join(",")}\nworld ${r.map(n => n.toFixed(2)).join(",")}\nscreen ${q.sx.toFixed(0)},${q.sy.toFixed(0)} p=${q.p.toFixed(2)}`
  })

  renderer.render(scene, camera)
  css2d.render(scene, camera)

  const far = P.reduce((a, q, i) => q.p < P[a].p ? i : a, 0)
  const near = P.reduce((a, q, i) => q.p > P[a].p ? i : a, 0)
  if (HEAVY || (now | 0) % 500 < 40) hud.textContent = `three ${renderer.constructor.name} webgl${renderer.capabilities.isWebGL2 ? "2" : ""}  fps ${fps.toFixed(0)}\nnearest v${near} p=${P[near].p.toFixed(2)}   farthest v${far} p=${P[far].p.toFixed(2)}\nDOM popovers: ${document.querySelectorAll(".pop").length}`
}
requestAnimationFrame(frame)
window.__cube = { renderer, css2d, scene, camera, pops, V, frames: () => frames }
</script>
</body>
</html>
