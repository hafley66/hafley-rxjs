<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>grapht live: rendered artifact epic</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        overflow: hidden;
        font: 12px/1.4 system-ui, sans-serif;
        color: #e2e8f0;
      }
      #host {
        position: fixed;
        inset: 0;
      }
      /* Mermaid paints dark strokes with no backdrop of its own. */
      body[data-source="sequence"] #host {
        background: #fdfdfb;
      }
      #host svg text {
        user-select: text;
        -webkit-user-select: text;
      }
      #bar {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 9;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        max-width: calc(100vw - 16px);
      }
      #bar label {
        display: flex;
        gap: 4px;
        align-items: center;
        color: #93c5fd;
        cursor: pointer;
      }
      #bar button[aria-pressed="true"] {
        background: #1d4ed8;
      }
      #bar button {
        background: #172554;
        color: #e2e8f0;
        border: 1px solid #93c5fd;
        border-radius: 3px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #bar button:disabled { opacity: 0.45; cursor: default; }
      #readout {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 9;
        font-family: ui-monospace, monospace;
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="arch" aria-pressed="true">arch epic</button>
      <button id="sequence" aria-pressed="false">large sequence</button>
      <button id="document">document renderer</button>
      <!-- IDs become window properties; "cytoscape" triggers fCoSE global auto-registration. -->
      <button id="renderer-cytoscape">cytoscape renderer</button>
      <button id="fit">fit</button>
      <label>Open SVG <input id="svg-import" type="file" accept=".svg,.json" multiple style="width:100px" title="SVG plus optional JSON containing graph and bindings"></label>
      <button id="layout-lab">layout policy</button>
      <label><input id="ribbon" type="checkbox" checked />actor ribbon</label>
      <label><input id="groups" type="checkbox" checked />group headers</label>
      <label><input id="dark" type="checkbox" checked />dark theme</label>
    </div>
    <details id="interaction-controls" style="position:fixed;left:8px;top:48px;z-index:10;background:#172554;padding:6px;max-width:420px">
      <summary>Interaction / hover</summary>
      <details id="wheel-settings"><summary>Zoom / momentum settings</summary>
        <label style="display:block">Zoom sensitivity <input data-wheel="zoomSensitivity" type="range" min="0.2" max="3" step="0.1"><output></output>×</label>
        <label style="display:block"><input data-wheel="momentum" type="checkbox">Momentum</label>
        <label style="display:block">Momentum strength <input data-wheel="strength" type="range" min="0" max="2" step="0.1"><output></output>×</label>
        <label style="display:block">Decay <input data-wheel="decayMs" type="range" min="20" max="300" step="5"><output></output> ms</label>
        <label style="display:block">Maximum tail <input data-wheel="maxDurationMs" type="range" min="100" max="1500" step="50"><output></output> ms</label>
        <button id="reset-wheel">Reset zoom / momentum</button>
      </details>
      <label>Hover <select id="hover-mode"><option>neighbors</option><option>upstream</option><option>downstream</option><option selected>both</option><option>off</option></select></label>
      <label>Relations <select id="hover-relations"><option value="actors">Actor links</option><option value="sequence">Sequence steps</option></select></label>
      <label>Hops <input id="hover-depth" type="number" min="1" max="20" value="2" style="width:44px"></label>
      <label><input id="hover-color-mode" type="checkbox"> Hop colors</label>
      <div id="hop-colors" aria-label="Hop colors"></div>
      <label><input id="hover-debug" type="checkbox">Debug hover</label>
      <details><summary>Group actors</summary><select id="actor-members" multiple size="6" style="width:100%"></select>
      <input id="actor-group-name" placeholder="Group name" value="Actor group"><button id="group-actors">Group selected</button></details>
      <div id="collapse-controls"></div>
      <button id="source-text">Original source</button>
      <pre id="source-preview" hidden style="max-height:40vh;overflow:auto;white-space:pre-wrap"></pre>
    </details>
    <pre id="hover-inspector" hidden style="position:fixed;right:8px;top:52px;z-index:11;max-width:540px;max-height:60vh;overflow:auto;pointer-events:auto;background:#0f172a;color:#e2e8f0;padding:10px;white-space:pre-wrap"></pre>
    <div id="host"></div>
    <div id="readout"></div>
    <script type="module" src="./live.ts"></script>
  </body>
</html>
