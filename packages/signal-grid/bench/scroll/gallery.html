<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>signal-grid scroll factors, live</title>
    <style>
      html, body { margin: 0; background: #14161a; color: #e6e8ea; font: 13px system-ui; color-scheme: dark }
      /* theme.css sets color-scheme: light dark on [data-route="g"], resetting the used value
         inside the grid; this unlayered rule beats that layered one, forcing the grid dark. */
      [data-route="g"] { color-scheme: dark }
      header.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
        padding: 10px 14px; background: #1b1e24; border-block-end: 1px solid #2a2f36 }
      header.bar h1 { font-size: 14px; margin: 0; font-weight: 600 }
      #readout { font-variant-numeric: tabular-nums; color: #a9b1ba }
      #readout b { color: #6fd7ad }
      button { font: inherit; color: inherit; background: #2a2f36; border: 0; border-radius: 4px; padding: 4px 10px; cursor: pointer }
      #board { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; align-items: flex-start }
      .b-card { background: #1b1e24; border: 1px solid #2a2f36; border-radius: 6px; overflow: hidden }
      .b-head { display: flex; flex-direction: column; padding: 8px 10px; gap: 2px; cursor: pointer }
      .b-card.b-dim { opacity: .35 }
      .b-head span { color: #7d868f; font-size: 11px }
      .b-host { overflow: hidden }
      .b-stats { display: flex; align-items: center; gap: 10px; padding: 6px 10px; color: #a9b1ba;
        font-variant-numeric: tabular-nums; font-size: 11px; border-block-start: 1px solid #2a2f36 }
      .b-bar { flex: 1; block-size: 5px; background: #2a2f36; border-radius: 3px; overflow: hidden }
      .b-bar i { display: block; block-size: 100%; background: #6fd7ad }
      .b-stack { display: flex; align-items: center; gap: 4px; min-inline-size: 0 }
      .b-dot { inline-size: 8px; block-size: 8px; border-radius: 50%; background: #6fd7ad; flex: none }
      .b-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
      .b-badge { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #2a2f36; flex: none }
      .b-meter { inline-size: 70px; block-size: 6px; background: #2a2f36; border-radius: 3px; overflow: hidden; flex: none }
      .b-fill { display: block; block-size: 100%; background: #6fd7ad }
      .b-num { font-variant-numeric: tabular-nums; font-size: 11px }
      rect { fill: #6fd7ad }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>signal-grid scroll factors</h1>
      <button id="toggle">run</button>
      <span style="color:#6e7681">click a tile header to run it alone</span>
      <div id="readout"></div>
    </header>
    <div id="board"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
