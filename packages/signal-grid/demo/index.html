<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>signal-grid demos</title>
  </head>
  <body>
    <div class="demo" id="demo">
      <header class="demo-top">
        <div class="demo-brand">
          <h1 class="demo-title">signal-grid</h1>
          <nav class="demo-nav" id="nav" aria-label="demos"></nav>
        </div>
        <div class="demo-head-text">
          <h2 class="route-title" id="route-title"></h2>
          <p class="route-blurb" id="route-blurb"></p>
        </div>
        <div class="control control-segment demo-theme" id="theme" role="group" aria-label="theme"></div>
      </header>
      <details class="demo-side demo-side-panel">
        <summary class="demo-side-summary">Controls</summary>
        <aside class="demo-panel" id="panel" aria-label="controls"></aside>
      </details>
      <div class="demo-gutter" id="gutter-panel" role="separator" aria-orientation="vertical" aria-label="resize the control panel"></div>
      <main class="demo-stage" id="stage"></main>
      <div class="demo-gutter" id="gutter-readout" role="separator" aria-orientation="vertical" aria-label="resize the readout"></div>
      <details class="demo-side demo-side-readout">
        <summary class="demo-side-summary">Readout</summary>
        <aside class="demo-readout" id="readout" aria-label="readout"></aside>
      </details>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
